name: CI
on:
  # Every branch, not just main: pushes to a PR branch were not reliably producing a
  # synchronize run, which left per-task commits unverified. Push is the trigger that
  # actually fires, and the concurrency group below still cancels superseded runs.
  push:
  workflow_dispatch:
# The default token is write-capable; nothing here needs to write.
permissions:
  contents: read
# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner
          POSTGRES_DB: planner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://planner:planner@localhost:5432/planner
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Literal test values — this plan's tests run against a fake Patreon client, so CI needs
      # no real credentials and no secrets.
      PATREON_CLIENT_ID: test-client-id
      PATREON_CLIENT_SECRET: test-client-secret
      PATREON_REDIRECT_URI: http://localhost:3000/auth/patreon/callback
      ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      JOBS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/api prisma:generate
      - run: pnpm -r typecheck
      - run: pnpm format:check
      - run: pnpm -r test
      - run: pnpm --filter @app/web build
      - run: pnpm --filter @app/api build
      # The Dockerfiles are intricate enough that three separate defects were found by hand;
      # nothing else guards them against regression.
      - run: docker build -f apps/api/Dockerfile -t patreonplanner-api .
      - run: docker build -f apps/web/Dockerfile -t patreonplanner-web .
