<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatreonPlanner</title>
    <!-- One asset for the icon and the header mark, because it is one piece of artwork. It
         already carries a real alpha channel, so it sits on any background without a white tile. -->
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <meta
      name="description"
      content="Pitch. Plan. Play. A request board for Patreon creators: patrons suggest what to cover next, and your own Patreon tiers decide what their voice can do."
    />
    <script>
      // Runs before the first paint, deliberately inline and blocking. Applying the theme from
      // React instead would render one frame in the wrong one, which on a dark-theme machine is a
      // white flash on every single navigation.
      (function () {
        try {
          var stored = localStorage.getItem('pp.theme');
          var choice = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* Storage blocked. The page renders light, and the menu still works. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
