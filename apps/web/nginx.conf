server {
  listen 80;
  root /usr/share/nginx/html;

  # The SPA and the API are served from one origin on purpose. Design §9 puts the session in an
  # httpOnly cookie and guards writes with a CSRF token the SPA must read — a split origin
  # breaks both halves: SameSite=Lax withholds the session cookie on cross-site XHR, and a
  # cookie set by an API host is not readable by script on the web host. Same-origin also means
  # no CORS allow-list to maintain. Keep this in step with apps/web/vite.config.ts, which
  # provides the same routing in development.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The OAuth routes are top-level browser navigations, not XHR, and live at the root rather
  # than under /api/v1 because the redirect URI is registered with Patreon.
  location /auth/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Webhooks are at the root for the same reason the OAuth routes are: the URL is registered
  # with Patreon and with Resend, so it must not move when the API version does. Without this
  # they fell to the SPA fallback below and every delivery was answered by index.html — a 405 to
  # the sender, and nothing visibly wrong here. The board simply updated at the next sync.
  location /webhooks/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
